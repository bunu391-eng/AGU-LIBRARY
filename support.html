<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - AGU LIBRARY</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">📚 AGU LIBRARY</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="library.html">Library</a>
        <a href="membership.html">Membership</a>
        <a href="support.html">Support</a>
    </nav>

</header>

<section class="hero">

    <h2>Customer Support</h2>

    <p>
        We're here to help you with any questions about AGU LIBRARY.
    </p>

</section>

<section class="login-page">

    <div class="login-box">

        <h2>Send Us a Message</h2>

        <form>

            <input
                type="text"
                placeholder="Full Name"
                required>

            <input
                type="email"
                placeholder="Email Address"
                required>

            <input
                type="text"
                placeholder="Subject"
                required>

            <textarea
                rows="6"
                placeholder="Write your message..."
                style="padding:15px;border:1px solid #ccc;border-radius:10px;font-size:16px;"
                required></textarea>

            <button type="submit">Send Message</button>

        </form>

        <p class="login-links">
            Our team will respond as soon as possible.
        </p>

    </div>

</section>

<footer>

    <h3>AGU LIBRARY</h3>

    <p>Professional & Educational Digital Library</p>

    <p>© 2026 AGU LIBRARY. All Rights Reserved.</p>

</footer>

</body>
</html>
