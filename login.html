<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGU LIBRARY - Admin Login</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>

<h1>AGU LIBRARY</h1>

</header>

<section style="max-width:400px;margin:50px auto;">

<h2>Admin Login</h2>

<input
type="email"
id="email"
placeholder="Email"
style="width:100%;padding:12px;margin-bottom:15px;">

<input
type="password"
id="password"
placeholder="Password"
style="width:100%;padding:12px;margin-bottom:15px;">

<button
class="btn"
style="width:100%;"
onclick="login()">

Login

</button>

</section>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
